version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: namma-company-postgres
    environment:
              POSTGRES_DB: namma_company
              POSTGRES_USER: namma_user
              POSTGRES_PASSWORD: namma_password
              TZ: Asia/Kolkata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/002_seed.sql

volumes:
  postgres_data:
